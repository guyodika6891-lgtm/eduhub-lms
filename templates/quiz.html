{% extends "base.html" %}
{% block content %}
<h3>{{ quiz.title }}</h3>
<p class="text-muted">{{ quiz.description }}</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% for q in questions %}
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <p class="fw-bold">{{ loop.index }}. {{ q.body }}</p>
        {% for key, opt in [('a', q.option_a), ('b', q.option_b), ('c', q.option_c), ('d', q.option_d)] %}
          <div class="form-check">
            <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="{{ key }}" id="q{{ q.id }}{{ key }}" required>
            <label class="form-check-label" for="q{{ q.id }}{{ key }}">{{ opt }}</label>
          </div>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
  <button class="btn btn-primary"><i class="bi bi-send"></i> Submit Quiz</button>
</form>
{% endblock %}
